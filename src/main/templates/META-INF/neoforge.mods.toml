modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
#updateJSONURL="https://change.me.example.invalid/updates.json"
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/"
logoFile = "pack.png"
logoBlur = false
authors = "${mod_authors}"
description = '''${mod_description}'''

# 客户端方块变更监听需要注入 ClientLevel.setBlocksDirty，故声明 Mixin 配置。
[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# 配置模块双端必需；轮盘和工具模块仅在客户端必需。
[[dependencies."${mod_id}"]]
modId = "anvillib_config"
type = "required"
versionRange = "[2.0.0-0,3.0.0)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "anvillib_wheel"
type = "required"
versionRange = "[2.0.0-0,3.0.0)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "anvillib_codec"
type = "optional"
versionRange = "[2.0.0-0,3.0.0)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "anvillib_network"
type = "optional"
versionRange = "[2.0.0-0,3.0.0)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "anvillib_integration"
type = "optional"
versionRange = "[2.0.0-0,3.0.0)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "anvillib_util"
type = "required"
versionRange = "[2.0.0-0,3.0.0)"
ordering = "AFTER"
side = "CLIENT"
