name: TODO
description: Add a to-do list for a project - 添加一个项目的待做事项
title: "[TODO] "
labels:
  - 📋️ TODO

body:
  - type: markdown
    attributes:
      value: |
        这是一个仅供项目内部使用的 `issue` 模板，请勿使用！
        This is an internal `issue` template for the project. Please do not use it!

  - type: input
    attributes:
      label: Items to be added to TODO - 要加入 TODO 的事项
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe what this TODO entails - 描述该 TODO 的具体内容
    validations:
      required: false
