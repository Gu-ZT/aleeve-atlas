name: Bug Report - Bug 反馈
description: Create a report to help us improve. - 反馈问题，帮助我们改进。
title: "[Bug] "
labels:
  - 🐛 bug

body:
  - type: markdown
    attributes:
      value: |
        Before submitting this `issue`, please make sure there are no similar or duplicate `issues` already open.
        填写此 `issue` 前，请先确认已开启的 `issue` 中没有类似或重复的 `issue`。

  - type: dropdown
    id: system
    attributes:
      label: OS Version - 操作系统
      options:
        - Linux
        - Windows
        - MacOS
    validations:
      required: true

  - type: input
    id: mc_version
    attributes:
      label: Minecraft Version Details - Minecraft 版本信息
      description: |
        Which version of Minecraft are you using?
        你使用的 Minecraft 版本是什么？
      placeholder: Minecraft version
    validations:
      required: true

  - type: dropdown
    id: mod_loader
    attributes:
      label: Mod Loader - 模组加载器
      options:
        - Forge
        - NeoForge
        - Fabric
        - Quilt
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version Details - 版本信息
      description: |
        Which version of the mod are you using?
        你使用的模组版本是什么？
      placeholder: Mod version
    validations:
      required: true

  - type: textarea
    id: exist
    attributes:
      label: Existing behavior - 当前行为
      description: |
        Please describe the problem you encountered in detail.
        请详细描述你遇到的问题。
    validations:
      required: true

  - type: textarea
    id: expect
    attributes:
      label: Expected behavior - 预期行为
      description: |
        Please describe the expected behavior in detail.
        请详细描述你预期的结果。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce - 复现步骤
      description: |
        How do you trigger this bug? Please provide step-by-step instructions.
        这个 bug 是怎么触发的？请详细说明复现步骤。
    validations:
      required: false

  - type: checkboxes
    id: know
    attributes:
      label: This issue is unique - 此 Issue 是唯一的
      options:
        - label: I have searched the issue tracker and confirmed that there is no duplicate issue. 我已搜索问题追踪器，并确认没有相同的 Issue。
          required: true
        - label: I admit that I previously checked all options without thorough verification and directly submitted this Issue, and I agree that it can be closed directly. 我承认此前未充分核实便勾选了所有选项并直接提交此 Issue ，且同意该 Issue 可被直接关闭。
        - label: I confirm that I am using the latest snapshot or LTS version of the mod; otherwise, this issue may be closed immediately. 我确认当前使用的是模组的最新快照版本或 LTS 版本，否则此 Issue 可被直接关闭。
          required: true
        - label: I promise to provide a detailed description of the issue, along with relevant logs and screenshots, rather than incomplete or vague information. 我承诺详细描述遇到的问题，并提供相关日志与截图，而非提供不完整或模糊的信息。
          required: true
