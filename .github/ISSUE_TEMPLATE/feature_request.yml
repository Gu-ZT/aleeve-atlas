name: Feature request - 功能请求
description: Suggest an idea for this project - 为该项目提出新想法
title: "[Feature] "
labels:
  - 🪁 enhancement

body:
  - type: markdown
    attributes:
      value: |
        Before submitting this `issue`, please make sure there are no similar or duplicate `issues` already open.
        填写此 `issue` 前，请先确认已开启的 `issue` 中没有类似或重复的 `issue`。

  - type: textarea
    attributes:
      label: What new features do you want? - 你想要什么新功能？
      description: |
        What new feature or improvement would you like to see, and how would it help? Please describe your request clearly and in detail, and include screenshots if possible.
        你想要什么新功能或改进？这会带来什么提升？请清晰、详细地描述你的需求，并尽可能附上截图。
    validations:
      required: true

  - type: checkboxes
    id: know
    attributes:
      label: This issue is unique - 此 Issue 是唯一的
      options:
        - label: I have searched the issue tracker and confirmed that there is no duplicate issue. 我已搜索问题追踪器，并确认没有相同的 Issue。
          required: true
        - label: I admit that I previously checked all options without thorough verification and directly submitted this Issue, and I agree that it can be closed directly. 我承认此前未充分核实便勾选了所有选项并直接提交此 Issue ，且同意该 Issue 可被直接关闭。
        - label: I confirm that I am using the latest snapshot or LTS version of the mod; otherwise, this issue may be closed immediately. 我确认当前使用的是模组的最新快照版本或 LTS 版本，否则此 Issue 可被直接关闭。
          required: true
        - label: I promise to provide a detailed description of the requested feature along with reasonable justification, rather than incomplete or vague information. 我承诺详细描述想要的新功能并附上合理的理由，而非提供不完整或模糊的信息。
          required: true
