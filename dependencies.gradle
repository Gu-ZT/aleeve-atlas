dependencies {
    // 直接编译可选模组 API，不打入发布 jar；开发验收时用 -PftbIntegration 安装到运行环境。
    [libs.ftb.library, libs.ftb.teams, libs.ftb.chunks, libs.architectury].each { dependency ->
        compileOnly(dependency) { transitive = false }
        if (project.hasProperty('ftbIntegration')) {
            runtimeOnly(dependency) { transitive = false }
        }
    }
    implementation libs.anvillib.codec
    jarJar libs.anvillib.codec
    implementation libs.anvillib.network
    jarJar libs.anvillib.network
    implementation libs.anvillib.config
    jarJar libs.anvillib.config
    implementation libs.anvillib.integration
    jarJar libs.anvillib.integration
    implementation libs.anvillib.util
    jarJar libs.anvillib.util
    implementation libs.anvillib.wheel
    jarJar libs.anvillib.wheel
    implementation libs.anvillib.rendering
    jarJar libs.anvillib.rendering

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named('test') {
    useJUnitPlatform()
}
